<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>APA Strategy Desk</title>
  <meta name="description" content="Advanced Price Action (APA) strategy dashboard for Deriv synthetics, XAUUSD and USD pairs.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M4 24 L11 12 L16 19 L21 8 L28 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="21" cy="8" r="2.6" fill="currentColor"/></svg>
        </span>
        <span class="brand-text"><strong>APA</strong> Desk<small>Advanced Price Action</small></span>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <div class="source-card" id="sourceCard"></div>
        <p class="disclaimer">Research and education tool. Not financial advice. No result here guarantees profit.</p>
      </div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-button menu-button" id="menuButton" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false"></button>
        <div class="topbar-title">
          <h1 id="viewTitle">Dashboard</h1>
          <p id="viewSubtitle" class="muted"></p>
        </div>
        <div class="topbar-controls">
          <label class="control">
            <span class="control-label">Market</span>
            <select id="symbolSelect" aria-label="Market"></select>
          </label>
          <div class="control">
            <span class="control-label">Entry</span>
            <div class="segmented" id="entryTimeframe" role="radiogroup" aria-label="Entry timeframe"></div>
          </div>
          <div class="control timeframe-stack" id="timeframeStack" aria-label="Structure and bias timeframes"></div>
          <span class="source-badge" id="sourceBadge" role="status"></span>
          <span class="clock mono" id="clock" aria-label="UTC time"></span>
          <button class="button button-ghost" id="refreshButton" aria-label="Reload candles and re-run the strategy"></button>
        </div>
      </header>

      <div class="demo-banner" id="demoBanner" hidden role="alert"></div>

      <main class="views">
        <section class="view" data-view="dashboard" aria-labelledby="viewTitle"></section>
        <section class="view" data-view="chart" hidden></section>
        <section class="view" data-view="calculator" hidden></section>
        <section class="view" data-view="checklist" hidden></section>
        <section class="view" data-view="journal" hidden></section>
        <section class="view" data-view="analytics" hidden></section>
        <section class="view" data-view="backtest" hidden></section>
        <section class="view" data-view="rules" hidden></section>
        <section class="view" data-view="settings" hidden></section>
      </main>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>

  <script src="js/core/storage.js"></script>
  <script src="js/core/timeframes.js"></script>
  <script src="js/core/instruments.js"></script>
  <script src="js/core/settings.js"></script>
  <script src="js/core/candles.js"></script>
  <script src="js/core/structure.js"></script>
  <script src="js/core/zones.js"></script>
  <script src="js/core/sessions.js"></script>
  <script src="js/core/engine.js"></script>
  <script src="js/core/signal.js"></script>
  <script src="js/core/performance.js"></script>
  <script src="js/core/position-size.js"></script>
  <script src="js/core/ml-model.js"></script>
  <script src="js/core/journal-store.js"></script>
  <script src="js/core/strategy-guide.js"></script>

  <script src="js/data/deriv-feed.js"></script>
  <script src="js/data/demo-feed.js"></script>
  <script src="js/data/csv-feed.js"></script>
  <script src="js/data/market-data.js"></script>

  <script src="js/ui/dom.js"></script>
  <script src="js/ui/icons.js"></script>
  <script src="js/ui/price-chart.js"></script>
  <script src="js/ui/views/performance-panels.js"></script>
  <script src="js/ui/views/ml-panel.js"></script>
  <script src="js/ui/views/dashboard.js"></script>
  <script src="js/ui/views/chart.js"></script>
  <script src="js/ui/views/calculator.js"></script>
  <script src="js/ui/views/checklist.js"></script>
  <script src="js/ui/views/journal.js"></script>
  <script src="js/ui/views/analytics.js"></script>
  <script src="js/ui/views/backtest.js"></script>
  <script src="js/ui/views/rules.js"></script>
  <script src="js/ui/views/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
