# Scans kopi's Deriv markets every 10 minutes and sends a Telegram alert only when a new APA trade opens.
name: Deriv trade alerts

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trade-alerts
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TZ: America/Jamaica
      SENT_FILE: ${{ github.workspace }}/sent-trades.json
      STRATEGY_DESK_TELEGRAM_BOT_TOKEN: ${{ secrets.STRATEGY_DESK_TELEGRAM_BOT_TOKEN }}
      STRATEGY_DESK_TELEGRAM_CHAT_ID: ${{ secrets.STRATEGY_DESK_TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The list of trades already sent, carried from run to run so nothing is sent twice.
      - uses: actions/cache/restore@v4
        with:
          path: sent-trades.json
          key: sent-trades-${{ github.run_id }}
          restore-keys: sent-trades-
      - run: node alerts/trade-alerts.mjs
      - uses: actions/cache/save@v4
        if: always() && hashFiles('sent-trades.json') != ''
        with:
          path: sent-trades.json
          key: sent-trades-${{ github.run_id }}
